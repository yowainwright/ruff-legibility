[package]
name = "ruff-legibility-native"
version = "0.4.2"
edition = "2024"
description = "Native Ruff parser backend for ruff-legibility."
license = "MIT"
repository = "https://github.com/yowainwright/ruff-legibility"

[lib]
name = "_native"
path = "src/native/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }
ruff_python_ast = "0.0.23"
ruff_python_parser = "0.0.23"
ruff_source_file = "0.0.23"
ruff_text_size = "0.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
