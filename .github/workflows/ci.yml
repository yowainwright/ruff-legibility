name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review runtime dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      RUFF_LEGIBILITY_NATIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Verify native backend
        run: |
          uv run --no-sync python -c "from ruff_legibility import _native"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Legibility self-check
        run: |
          uv run --no-sync ruff-legibility check \
            src tests scripts \
            --output-format github
      - name: Export legibility report
        if: always()
        run: |
          uv run --no-sync ruff-legibility check \
            src tests scripts \
            --output-format json \
            --exit-zero > ruff-legibility.json
      - name: Upload legibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legibility-${{ matrix.python-version }}
          path: ruff-legibility.json
      - name: Test
        run: uv run --no-sync pytest
      - name: Build
        run: uv build --no-sources

  e2e:
    name: recipe E2Es
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build recipe examples
        run: make test-e2e
